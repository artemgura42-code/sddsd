name: Android debug build
on:
  workflow_dispatch:
  push:
    branches: [ "main", "master" ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Download Stockfish 19 ARM64 and NNUE
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p app/src/main/assets
          curl -L --fail --retry 3 \
            "https://sourceforge.net/projects/stockfish.mirror/files/sf_19/stockfish-android-arm64-universal.tar.gz/download" \
            -o /tmp/stockfish.tar.gz
          mkdir -p /tmp/sf
          tar -xzf /tmp/stockfish.tar.gz -C /tmp/sf
          BIN="$(find /tmp/sf -type f -perm -u+x | head -n 1)"
          if [ -z "$BIN" ]; then
            BIN="$(find /tmp/sf -type f -iname '*stockfish*' | head -n 1)"
          fi
          test -n "$BIN"
          cp "$BIN" app/src/main/assets/stockfish
          chmod +x app/src/main/assets/stockfish
          curl -L --fail --retry 3 \
            "https://tests.stockfishchess.org/api/nn/nn-1a298aa575a0.nnue" \
            -o app/src/main/assets/nn-1a298aa575a0.nnue
          test -s app/src/main/assets/nn-1a298aa575a0.nnue
      - name: Build debug APK
        run: |
          chmod +x ./gradlew 2>/dev/null || true
          gradle --no-daemon assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: ChessVision2-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
